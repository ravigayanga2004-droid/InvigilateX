services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: examguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examguard_local}
      POSTGRES_DB: examguard
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examguard -d examguard"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
